<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><section class="card"><div class="badge">DASHBOARD</div><h1>Submission Complete</h1><p>Your information was sent to the connected Telegram chat.</p><div id="summary" class="summary"></div><a id="homeBtn" class="btn secondary" href="index.html">Back to Home</a></section></main><script src="script.js"></script><script>const chat=getChatId(),data=JSON.parse(sessionStorage.getItem('lastSubmission')||'null');document.getElementById('summary').innerHTML=data?'<div><span>Name</span><strong>'+escapeHtml(data.firstName)+'</strong></div><div><span>Mobile</span><strong>'+escapeHtml(data.mobile)+'</strong></div><div><span>Email</span><strong>'+escapeHtml(data.email)+'</strong></div><div><span>Message</span><strong>'+escapeHtml(data.message)+'</strong></div>':'<p class="small">No local submission data available.</p>';document.getElementById('homeBtn').href=chat?'index.html?chat='+encodeURIComponent(chat):'index.html';</script></body></html>
