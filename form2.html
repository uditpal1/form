<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form 2</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><section class="card"><div class="step">STEP 2 OF 2</div><h1>Message</h1><p>Complete the second part and submit.</p><form id="form2"><label>Email<input id="email" type="email" required maxlength="120" autocomplete="email" placeholder="you@example.com"></label><label>Message<textarea id="message" required maxlength="2000" rows="7" placeholder="Write your message"></textarea></label><button class="btn" id="submitBtn" type="submit">Submit</button></form><p id="error" class="error"></p></section></main><script src="script.js"></script><script>const chat=getChatId();document.getElementById('form2').addEventListener('submit',async e=>{e.preventDefault();if(!chat)return showError('Invalid testing link.');const previous=JSON.parse(sessionStorage.getItem('formData')||'null');if(!previous)return showError('Form 1 data is missing. Please start again.');const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Sending...';const text='📩 New Form Submission\n\n👤 First Name: '+previous.firstName+'\n📱 Mobile: '+previous.mobile+'\n\n📧 Email: '+email.value.trim()+'\n💬 Message:\n'+message.value.trim()+'\n\n🕒 Submitted: '+new Date().toLocaleString();try{await sendToTelegram(chat,text);sessionStorage.setItem('lastSubmission',JSON.stringify({...previous,email:email.value.trim(),message:message.value.trim()}));sessionStorage.removeItem('formData');location.href='dashboard.html?chat='+encodeURIComponent(chat)+'&success=1'}catch(err){showError(err.message);btn.disabled=false;btn.textContent='Submit'}});</script></body></html>
