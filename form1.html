<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form 1</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><section class="card"><div class="step">STEP 1 OF 2</div><h1>Your Details</h1><p>Enter your first name and mobile number.</p><form id="form1"><label>First Name<input id="firstName" required maxlength="60" autocomplete="given-name" placeholder="Enter first name"></label><label>Mobile Number<input id="mobile" required maxlength="20" inputmode="tel" autocomplete="tel" placeholder="Enter mobile number"></label><button class="btn" type="submit">Continue</button></form><p id="error" class="error"></p></section></main><script src="script.js"></script><script>const chat=getChatId();document.getElementById('form1').addEventListener('submit',e=>{e.preventDefault();if(!chat)return showError('Invalid testing link.');sessionStorage.setItem('formData',JSON.stringify({firstName:firstName.value.trim(),mobile:mobile.value.trim()}));location.href='form2.html?chat='+encodeURIComponent(chat)});</script></body></html>
